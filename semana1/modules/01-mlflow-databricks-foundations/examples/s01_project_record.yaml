# Copia esta plantilla en tu entrega. No incluyas datos personales, tokens,
# nombres de pacientes ni contenido sensible de prompts.
project:
  name: "clasificacion_wine_quality_didactica"
  team_alias: "pareja-07"
  decision_supported: "seleccionar con validación y comprobar una vez en test"
  users_affected: "equipo docente; ninguna decisión comercial"
data:
  source: "data/raw/WineQT.csv (caso didáctico del repositorio)"
  contains_personal_data: false
  limitations:
    - "quality_high vale 1 cuando quality >= 6; el umbral es una decisión didáctica."
    - "No representa una población vinícola completa ni autoriza decisiones comerciales."
evidence:
  mlflow_experiment: "experimento asociado al notebook de Free Edition"
  batch_id: "xxxxxxxx"
  candidate_runs: 7
  selection_gate:
    minimum_validation_f1_macro: 0.70
    ranking:
      - "validation.f1_macro DESC"
      - "validation.accuracy DESC"
      - "validation.latency_ms_per_row ASC"
    test_used_for_selection: false
  winner:
    run_id: "TODO"
    validation_f1_macro: null
    validation_recall_macro: null
    test_f1_macro: null
    test_recall_macro: null
registry:
  registered_model: "catalog.schema.wine_quality_classifier_pareja_07"
  rollback_version: null
  champion_version: null
  challenger_smoke_test_passed: true
  rollback_verified: true
  alias: "Champion"
  signature_present: true
deployment:
  mode: "local_notebook_http"
  source_artifact: "deployment/model.joblib"
  public_endpoint: false
  persistent: false
  deployment_run_id: "TODO"
  contract_tests:
    health_status: 200
    valid_prediction_status: 200
    invalid_request_status: 400
    non_object_json_status: 400
  api_stopped: true
risks:
  - id: R1
    risk: "Uso de quality_high como garantía de calidad comercial"
    impact: high
    likelihood: medium
    owner: "equipo de producto"
    mitigation: "Aviso explícito, validación de laboratorio y prohibición de uso comercial."
  - id: R2
    risk: "Un secreto aparece en un parámetro, tag, artefacto o traza"
    impact: high
    likelihood: low
    owner: "responsable técnico"
    mitigation: "Usar identidad del entorno o Secrets; revisar logs antes de compartir."
  - id: R3
    risk: "Training y serving aplican transformaciones diferentes"
    impact: high
    likelihood: medium
    owner: "ml_engineer"
    mitigation: "Empaquetar preprocessing y modelo en el mismo Pipeline y probar el contrato."
  - id: R4
    risk: "Una respuesta de agente no está respaldada por el contexto"
    impact: medium
    likelihood: medium
    owner: "responsable de IA"
    mitigation: "Trazas, conjunto de evaluación y revisión humana."
